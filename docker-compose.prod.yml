# ---------------------------------------------------------------
# Portfolio — one-command production deploy.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.local up -d
#
# Services:
#   db   - MySQL 8, persistent volume `portfolio_db`
#   api  - Spring Boot API, storage on persistent volume `portfolio_storage`
#   web  - nginx serving Vite bundle + reverse-proxying /api/* to api:9090
#
# Ports:
#   Only :80 is exposed by default. Put a proper TLS proxy (Caddy /
#   Cloudflare Tunnel / Nginx w/ certbot) in front for HTTPS.
#
# Before first `up`:
#   1. Copy .env.example → .env.local at the repo root and fill in the
#      values (APP_ADMIN_PASSWORD, APP_CONTACT_IP_SALT, DB_PASSWORD, etc).
#   2. Verify SITE_BASE_URL points at whatever domain you expose.
#   3. In /admin/settings after first launch, paste the Razorpay / Stripe
#      keys — env vars are the fallback, admin panel is the live source.
# ---------------------------------------------------------------

services:

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE:      ${DB_NAME:-portfolio}
      MYSQL_USER:          ${DB_USER:-portfolio}
      MYSQL_PASSWORD:      ${DB_PASSWORD:?DB_PASSWORD env var is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD env var is required}
    volumes:
      - portfolio_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [portfolio]

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE:  prod
      DB_URL:                  jdbc:mysql://db:3306/${DB_NAME:-portfolio}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
      DB_USER:                 ${DB_USER:-portfolio}
      DB_PASSWORD:             ${DB_PASSWORD}
      APP_ADMIN_EMAIL:         ${APP_ADMIN_EMAIL:?required}
      APP_ADMIN_PASSWORD:      ${APP_ADMIN_PASSWORD:?required — must not be a weak default}
      APP_CONTACT_IP_SALT:     ${APP_CONTACT_IP_SALT:?required in prod}
      SITE_BASE_URL:           ${SITE_BASE_URL:?required — used in emails + sitemap}
      ALLOWED_ORIGINS:         ${ALLOWED_ORIGINS:-${SITE_BASE_URL}}
      TRUST_FORWARDED_FOR:     "true"
      TRUSTED_PROXIES:         ${TRUSTED_PROXIES:-172.16.0.0/12}
      # Optional — everything below can also be set from /admin/settings.
      RAZORPAY_KEY_ID:         ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET:     ${RAZORPAY_KEY_SECRET:-}
      STRIPE_SECRET_KEY:       ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET:   ${STRIPE_WEBHOOK_SECRET:-}
      CONTACT_NOTIFY_TO:       ${CONTACT_NOTIFY_TO:-}
      CONTACT_FROM:            ${CONTACT_FROM:-}
      MAIL_HOST:               ${MAIL_HOST:-smtp.sendgrid.net}
      MAIL_PORT:               ${MAIL_PORT:-587}
      MAIL_USERNAME:           ${MAIL_USERNAME:-apikey}
      MAIL_PASSWORD:           ${MAIL_PASSWORD:-}
    volumes:
      - portfolio_storage:/var/portfolio/storage
    networks: [portfolio]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      API_UPSTREAM: http://api:9090
    ports:
      - "${WEB_PORT:-80}:80"
    networks: [portfolio]

volumes:
  portfolio_db:
  portfolio_storage:

networks:
  portfolio:
    driver: bridge
