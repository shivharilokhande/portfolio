# Base configuration — common to all profiles.
# Profile-specific overrides live in application-{dev,prod,test}.yml

spring:
  application:
    name: portfolio-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true
  servlet:
    multipart:
      # Digital products ship as ZIPs — bump the limits.
      max-file-size: 200MB
      max-request-size: 220MB

server:
  # Cloud Run injects PORT=8080. The 9090 default is only used for local
  # dev. Keep this in sync with the Dockerfile's ENV PORT + EXPOSE.
  port: ${PORT:9090}
  compression:
    enabled: true
  error:
    include-message: always
    include-stacktrace: never
  # Cloud Run + Cloudflare terminate TLS upstream and forward the real
  # client info via X-Forwarded-* headers. Trust them so request.remoteAddr
  # reflects the actual client (essential for the contact-form rate limiter).
  # Pair with TRUST_FORWARDED_FOR=true in prod.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true

# Spring Cache (Caffeine) — used by the product catalog reads.
spring.cache:
  type: caffeine
  cache-names: products, productBySlug, portfolioSections
  caffeine:
    spec: maximumSize=500,expireAfterWrite=120s

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  rate-limit:
    contact-per-hour: 5      # max contact submissions / hour / IP
    api-per-minute: 300      # max generic GET / minute / IP — generous enough for
                             # the CMS polling (list + N body reads every 15 s)
                             # plus normal browsing traffic.
    # X-Forwarded-For handling. Leave false by default so a client can't spoof
    # its IP and evade the admin-login brute-force cap. When running behind a
    # trusted proxy (Nginx, Caddy, Cloudflare Tunnel, etc.) set the env vars.
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
    trusted-proxies:     ${TRUSTED_PROXIES:}
  contact:
    notify-to: ${CONTACT_NOTIFY_TO:shivlokhande7080@gmail.com}
    from:      ${CONTACT_FROM:no-reply@shivhari.tech}
    # Salt used when hashing submitter IPs for the SPAM heuristic. The source-
    # visible default is fine in dev but MUST be overridden in prod (the app
    # refuses to start otherwise) — otherwise a DB dump lets an attacker
    # rainbow-table IPv4 space in seconds.
    ip-salt:   ${APP_CONTACT_IP_SALT:portfolio-salt}

  # ----- Store payment gateways -----
  # Leave keys blank to keep the stub providers active (no real charges).
  # Drop real keys here (or via env vars) to switch into live mode.
  payment:
    razorpay:
      key-id:     ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

  # ----- Admin dashboard credentials -----
  # Sign in at /admin with these. Override via env vars for prod.
  # WARNING: the password below ("123456") is a weak literal chosen for
  # local development convenience. Set APP_ADMIN_PASSWORD to a strong
  # random string before deploying anywhere reachable from the internet.
  admin:
    email:    ${APP_ADMIN_EMAIL:shivlokhande7080@gmail.com}
    password: ${APP_ADMIN_PASSWORD:123456}

  # ----- Asset storage -----
  # Uploaded product ZIPs, product demo images, and the admin CV PDF go
  # through the StorageService abstraction (see storage/StorageService.java).
  #
  # Two providers ship in-tree:
  #
  #   provider=local  — writes to `base-path` on disk. Default. Fine for dev
  #                     and for any host with a persistent volume mounted
  #                     (Docker named volume, EBS, Render Starter+).
  #   provider=r2     — writes to Cloudflare R2 (S3-compatible). The choice
  #                     for hosts with ephemeral disks (Render Free tier,
  #                     Fly.io free VMs, App Runner, Cloud Run). Requires
  #                     the four r2.* properties below to be set — the app
  #                     REFUSES TO BOOT if provider=r2 and any is missing,
  #                     to prevent silent data loss.
  storage:
    provider:   ${APP_STORAGE_PROVIDER:local}
    base-path:  ${APP_STORAGE_DIR:./.storage}
    r2:
      endpoint:          ${R2_ENDPOINT:}          # https://<account-id>.r2.cloudflarestorage.com
      access-key-id:     ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket:            ${R2_BUCKET:}
      public-url-base:   ${R2_PUBLIC_URL:}        # https://pub-<hash>.r2.dev  OR  https://cdn.example.com

# Mail — uses Spring's standard mail starter. SendGrid SMTP relay works out of the box:
#   host=smtp.sendgrid.net, port=587, username=apikey, password=<SENDGRID_API_KEY>
spring.mail:
  host:     ${MAIL_HOST:smtp.sendgrid.net}
  port:     ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:apikey}
  password: ${MAIL_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
