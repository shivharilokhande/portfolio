# MySQL profile — real MySQL on localhost (or wherever DB_URL points).
#
# Spin up a local MySQL via docker-compose (the 'mysql' service):
#     docker compose up mysql -d
# Then run the API with -Dspring.profiles.active=mysql
#
# This profile is also a faithful staging mirror of prod.

spring:
  datasource:
    url:      ${DB_URL:jdbc:mysql://localhost:3306/portfolio?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:portfolio}
    password: ${DB_PASSWORD:portfolio}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle:      2
      connection-timeout: 5000
      pool-name:         portfolio-cp
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.personal.portfolio: DEBUG
    org.springframework.web: INFO
