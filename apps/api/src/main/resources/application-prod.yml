# Prod profile — TiDB Serverless (MySQL 8.0-wire-compatible) + Render + Cloudflare R2.
#
# Required env vars in prod (set on Render → Environment):
#   DB_URL       — jdbc:mysql://<host>:4000/<db>?useSSL=true&requireSSL=true&serverTimezone=UTC&enabledTLSProtocols=TLSv1.2,TLSv1.3
#                  (TiDB Serverless listens on port 4000 and REQUIRES TLS)
#   DB_USERNAME, DB_PASSWORD    — from TiDB Cloud dashboard
#   ALLOWED_ORIGINS             — https://shivhari.tech,https://www.shivhari.tech
#   APP_ADMIN_PASSWORD          — strong random password
#   APP_CONTACT_IP_SALT         — random 32+ char string
#   RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET
#   RAZORPAY_WEBHOOK_SECRET
#   STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET (optional)
#   BREVO_API_KEY               — Brevo transactional email HTTP API key
#   SITE_BASE_URL               — https://shivhari.tech
#   TRUST_FORWARDED_FOR=true    — Render + Cloudflare terminate TLS upstream
#
#   ---- Object storage (Cloudflare R2) — MANDATORY on Render Free ----
#   APP_STORAGE_PROVIDER=r2     — flips StorageConfig from local disk to R2
#   R2_ENDPOINT                 — https://<accountId>.r2.cloudflarestorage.com
#   R2_ACCESS_KEY_ID            — from R2 → Manage R2 API Tokens
#   R2_SECRET_ACCESS_KEY        — same source, shown once at token creation
#   R2_BUCKET                   — the bucket name, e.g. shivhari-tech-storage
#   R2_PUBLIC_URL               — public R2.dev subdomain, e.g. https://pub-<hash>.r2.dev
#                                 (or a custom domain like https://cdn.shivhari.tech)
#
# Render injects PORT=8080; Spring picks it up via server.port in application.yml.

spring:
  datasource:
    url:      ${DB_URL:jdbc:mysql://localhost:3306/portfolio?useSSL=true&serverTimezone=UTC}
    username: ${DB_USERNAME:portfolio}
    password: ${DB_PASSWORD:portfolio}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # TiDB Serverless free tier caps concurrent connections to a small
      # number, and Cloud Run scales to zero — a fat pool is wasteful. Keep
      # it lean so cold starts don't stampede the DB.
      maximum-pool-size:  5
      minimum-idle:       1
      connection-timeout: 10000
      idle-timeout:       300000
      max-lifetime:       900000
      pool-name:          portfolio-cp
      data-source-properties:
        cachePrepStmts:       true
        prepStmtCacheSize:    250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts:   true
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
    properties:
      hibernate:
        jdbc.batch_size:    25
        order_inserts:      true
        order_updates:      true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Health indicators — override Spring Boot's default composite so /actuator/health
# reports UP as long as the DB is reachable. Without these overrides, mail (which
# is intentionally unconfigured on first boot) reports DOWN and pulls the whole
# composite DOWN, which Render then treats as an unhealthy service.
management:
  health:
    mail:
      enabled: false   # no SMTP creds until Brevo is wired via env vars
    ssl:
      enabled: false   # avoid SslHealthIndicator noise on containers without cert bundles
  endpoint:
    health:
      show-details: always   # expose which indicators are UP/DOWN — health data is not sensitive

logging:
  level:
    com.personal.portfolio: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
