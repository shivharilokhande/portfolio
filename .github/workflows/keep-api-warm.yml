# Keeps the Render free-tier API from spinning down (it sleeps after ~15 min
# idle and takes ~50 s to wake, which left store pages blank on first visit).
# Pings the health endpoint every 10 minutes. Cost: ~4,400 tiny requests/month.
# Note: GitHub pauses scheduled workflows after 60 days without repo activity —
# any commit re-enables it.
name: keep-api-warm
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 https://api.shivhari.tech/actuator/health) && echo "attempt $i → $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "API did not answer 200 after 3 attempts (Render may be redeploying)"; exit 0
      - name: Warm the product catalog
        run: curl -s -o /dev/null --max-time 60 https://api.shivhari.tech/api/store/products || true
